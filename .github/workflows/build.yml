
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: |
          mkdir -p www/lib
          cp index.html www/index.html
          cp node_modules/jszip/dist/jszip.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/
      - run: npx cap add android
      - run: |
          sed -i 's|<application|<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries><application|' android/app/src/main/AndroidManifest.xml
          grep -c TTS_SERVICE android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: voxbook-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
